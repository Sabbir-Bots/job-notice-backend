name: Clean and Discover Notice Paths

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Step 1 - Clean URLs
        run: python clean_urls.py

      - name: Step 2 - Discover notice paths
        run: python discover_notice_paths.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: notice-discovery-results
          path: |
            cleaned_base_urls.txt
            sources.json
            unmatched.txt
