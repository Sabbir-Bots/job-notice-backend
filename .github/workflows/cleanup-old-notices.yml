name: Cleanup Old Notices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = শুধু দেখাবে, কিছু মুছবে না)'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Firebase Credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS" > firebase_credentials.json

      - name: Run cleanup (dry run)
        if: ${{ inputs.dry_run == true }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python cleanup_old_notices.py --dry-run

      - name: Run cleanup (LIVE — actually deletes)
        if: ${{ inputs.dry_run == false }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python cleanup_old_notices.py
