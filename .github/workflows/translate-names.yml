name: Translate Office Names

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install deep-translator

      - name: Translate names
        run: python translate_names.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sources-with-english-names
          path: sources.json
